name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install lightgbm pandas numpy requests
      - run: python -m unittest stuff.test_score_stuff location.test_score_location
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hitter-pa.test.js hitting-card-stats.test.js pitcher-card-stats.test.js pitch-type.test.js
