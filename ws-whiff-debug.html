<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graham Whiff Debug</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:20px;max-width:500px;margin:0 auto}
h2{color:#1a3a5c;margin-bottom:10px}
canvas{display:block;background:#fff;border:1px solid #ccc;margin:10px 0}
#status{font-size:.85rem;color:#666;margin-bottom:4px}
#count{font-weight:bold;color:#1a3a5c;margin-bottom:8px}
table{border-collapse:collapse;width:100%;font-size:.8rem;margin-top:12px}
th{background:#1a3a5c;color:#fff;padding:4px 6px;text-align:left}
td{padding:4px 6px;border-bottom:1px solid #ddd}
</style>
</head>
<body>
<h2>Luke Graham — Raw Whiff Locations</h2>
<div id="status">Loading...</div>
<div id="count"></div>
<canvas id="cv" width="360" height="300"></canvas>
<div style="font-size:.75rem;color:#888;margin-bottom:12px">Each dot = one StrikeSwinging. Red = inside zone, Blue = outside zone. PlateLocSide as-is from TrackMan (catcher looking toward plate).</div>
<div id="table"></div>

<script>
var SUPABASE_URL='https://mghrapwhvihpwgqryail.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1naHJhcHdodmlocHdncXJ5YWlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MjQ0NzUsImV4cCI6MjA5MTAwMDQ3NX0.ilNGmGOOc-TIpwQx0e1cTK1YjYF9TvdL7nEGUEXiWFc';

async function load(){
  document.getElementById('status').textContent='Fetching pitches...';
  var rows=[],from=0;
  while(true){
    var r=await fetch(SUPABASE_URL+'/rest/v1/pitches?PitchCall=eq.StrikeSwinging&limit=1000&offset='+from,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    var d=await r.json();
    if(!Array.isArray(d)||!d.length)break;
    rows=rows.concat(d);
    if(d.length<1000)break;
    from+=1000;
  }
  var graham=rows.filter(function(r){
    return r.Batter&&r.Batter.toLowerCase().includes('graham')&&
           r.BatterTeam&&r.BatterTeam.toLowerCase().includes('wal');
  });
  document.getElementById('status').textContent='Total StrikeSwinging in DB: '+rows.length;
  document.getElementById('count').textContent='Graham whiffs: '+graham.length;
  draw(graham);
  buildTable(graham);
}

function draw(pts){
  var cv=document.getElementById('cv');
  var ctx=cv.getContext('2d');
  var W=cv.width,H=cv.height,PAD=32;
  var xMin=-2,xMax=2,yMin=0,yMax=5;
  function mx(v){return PAD+(v-xMin)/(xMax-xMin)*(W-PAD*2);}
  function my(v){return H-PAD-(v-yMin)/(yMax-yMin)*(H-PAD*2);}

  ctx.fillStyle='#f8fafd';ctx.fillRect(0,0,W,H);

  // Grid lines
  ctx.strokeStyle='#e0e8f0';ctx.lineWidth=0.5;
  [-1,0,1].forEach(function(x){
    ctx.beginPath();ctx.moveTo(mx(x),PAD);ctx.lineTo(mx(x),H-PAD);ctx.stroke();
  });

  // Strike zone
  ctx.strokeStyle='#1a3a5c';ctx.lineWidth=2;
  ctx.strokeRect(mx(-0.833),my(3.5),mx(0.833)-mx(-0.833),my(1.5)-my(3.5));

  // Zone grid lines
  ctx.strokeStyle='#aac';ctx.lineWidth=0.5;
  var zw=(mx(0.833)-mx(-0.833))/3;
  var zh=(my(1.5)-my(3.5))/3;
  for(var i=1;i<3;i++){
    ctx.beginPath();ctx.moveTo(mx(-0.833)+zw*i,my(3.5));ctx.lineTo(mx(-0.833)+zw*i,my(1.5));ctx.stroke();
    ctx.beginPath();ctx.moveTo(mx(-0.833),my(3.5)+zh*i);ctx.lineTo(mx(0.833),my(3.5)+zh*i);ctx.stroke();
  }

  // Axis labels
  ctx.fillStyle='#888';ctx.font='9px sans-serif';ctx.textAlign='center';
  [-1,0,1].forEach(function(x){ctx.fillText(x,mx(x),H-4);});
  ctx.textAlign='right';
  ctx.fillText('3.5',PAD-4,my(3.5)+3);
  ctx.fillText('1.5',PAD-4,my(1.5)+3);

  // Plate
  ctx.fillStyle='#bbb';
  ctx.fillRect(mx(-0.708),my(0.15),mx(0.708)-mx(-0.708),4);

  // Dots
  var inZone=0,outZone=0;
  pts.forEach(function(p){
    var side=parseFloat(p.PlateLocSide);
    var height=parseFloat(p.PlateLocHeight);
    if(isNaN(side)||isNaN(height))return;
    var inside=Math.abs(side)<=0.833&&height>=1.5&&height<=3.5;
    if(inside)inZone++;else outZone++;
    ctx.beginPath();ctx.arc(mx(side),my(height),5,0,Math.PI*2);
    ctx.fillStyle=inside?'rgba(200,40,40,0.75)':'rgba(40,90,200,0.75)';
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.8;ctx.stroke();
  });

  // Labels
  ctx.fillStyle='#333';ctx.font='10px sans-serif';ctx.textAlign='left';
  ctx.fillText('In zone (red): '+inZone,8,14);
  ctx.fillText('Out zone (blue): '+outZone,8,26);
  ctx.fillStyle='#1a3a5c';ctx.textAlign='center';
  ctx.fillText("Catcher's View · PlateLocSide as-is",W/2,H-18);
  ctx.fillStyle='#888';ctx.font='8px sans-serif';
  ctx.fillText("Left = negative side | Right = positive side",W/2,H-8);
}

function buildTable(pts){
  if(!pts.length)return;
  var html='<table><tr><th>Side</th><th>Height</th><th>Pitch</th><th>Balls</th><th>Strikes</th><th>In Zone</th></tr>';
  pts.forEach(function(p){
    var side=parseFloat(p.PlateLocSide);
    var height=parseFloat(p.PlateLocHeight);
    var inside=Math.abs(side)<=0.833&&height>=1.5&&height<=3.5;
    html+='<tr>'+
      '<td>'+(isNaN(side)?'--':side.toFixed(2))+'</td>'+
      '<td>'+(isNaN(height)?'--':height.toFixed(2))+'</td>'+
      '<td>'+(p.TaggedPitchType||p.AutoPitchType||'--')+'</td>'+
      '<td>'+(p.Balls||p.BallCount||'--')+'</td>'+
      '<td>'+(p.Strikes||p.StrikeCount||'--')+'</td>'+
      '<td>'+(inside?'YES':'no')+'</td>'+
      '</tr>';
  });
  html+='</table>';
  document.getElementById('table').innerHTML=html;
}

load();
</script>

</body>
</html>
