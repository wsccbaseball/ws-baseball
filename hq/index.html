<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1c2c" />
  <title>WS Baseball HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy: #0b1c2c;
      --bg: #f5f5f5;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #666;
      --border: #ddd;
      --input-border: #ccc;
      --ok: #3d8b6e;
      --danger: #b33a3a;
      --radius: 4px;
      --nav-h: 64px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      /* aliases so leftover var() refs stay light/quiet */
      --cream: #1a1a1a;
      --accent: #0b1c2c;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Barlow, system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, h3, .brand {
      font-family: Barlow, system-ui, -apple-system, sans-serif;
      letter-spacing: 0.01em;
      font-weight: 600;
    }
    a { color: var(--navy); }
    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }
    .hidden { display: none !important; }

    /* Gate */
    #gate {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
    }
    .gate-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 22px;
      text-align: center;
    }
    .gate-card h1 { font-size: 1.6rem; margin-bottom: 6px; }
    .gate-card p { color: var(--muted); margin-bottom: 18px; font-size: 0.92rem; }
    .gate-card input {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--input-border);
      background: var(--surface);
      color: var(--text);
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 0.08em;
    }
    .err { color: var(--danger); font-size: 0.88rem; margin-top: 10px; min-height: 1.2em; }

    /* App shell */
    #app { min-height: 100dvh; padding-bottom: calc(var(--nav-h) + var(--safe-b) + 12px); background: var(--bg); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--navy);
      border-bottom: 1px solid var(--navy);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #fff;
    }
    .topbar .brand { font-size: 1.15rem; color: #fff; }
    .topbar .brand span { color: #fff; opacity: 0.9; }
    .topbar .btn.ghost { color: rgba(255,255,255,0.85); }
    .content { padding: 14px 14px 8px; max-width: 560px; margin: 0 auto; }

    .nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 50;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }
    .nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .nav a.active {
      color: var(--navy);
      box-shadow: inset 0 -2px 0 var(--navy);
    }
    .nav a .ico { font-size: 1.15rem; line-height: 1; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: var(--radius);
      border: none;
      background: var(--navy);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn:active { opacity: 0.9; }
    .btn.secondary {
      background: transparent;
      border: 1px solid var(--input-border);
      color: var(--text);
    }
    .btn.ghost {
      background: transparent;
      border: none;
      color: var(--muted);
      width: auto;
      padding: 6px 8px;
      font-size: 0.85rem;
    }
    .btn.sm { padding: 7px 10px; font-size: 0.85rem; width: auto; }
    .btn.danger { background: var(--danger); color: #fff; }
    .row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .row-btns .btn { width: auto; flex: 1; min-width: 100px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
    }
    .card.tap { cursor: pointer; }
    .card.tap:active { background: #eee; }
    .card h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .meta { color: var(--muted); font-size: 0.82rem; }
    .counts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    @media (min-width: 420px) {
      .counts.rich { grid-template-columns: repeat(5, 1fr); }
    }
    .counts.rich { grid-template-columns: repeat(2, 1fr); }
    .dash-practice {
      margin-bottom: 12px;
    }
    .dash-practice ul { margin: 8px 0 0 18px; color: var(--muted); font-size: 0.9rem; }
    .search-box { width: 100%; margin-bottom: 0; }
    .count {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 8px;
      text-align: center;
    }
    .count .n { font-family: Barlow, system-ui, sans-serif; font-size: 1.6rem; color: var(--navy); font-weight: 700; }
    .count .l { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 4px 0 10px;
    }
    .section-title h2 { font-size: 1.25rem; }

    .empty {
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      background: var(--surface);
    }
    .empty strong { display: block; color: var(--text); margin-bottom: 4px; }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .filters select, .filters input, .form-grid input, .form-grid select, .form-grid textarea {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--input-border);
      background: var(--surface);
      color: var(--text);
    }
    .form-grid {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }
    .form-grid label {
      display: grid;
      gap: 4px;
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-grid textarea { min-height: 80px; resize: vertical; }
    .chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e8eef2;
      color: var(--navy);
      font-size: 0.72rem;
      font-weight: 600;
      margin-right: 4px;
    }
    .chip.ok { background: rgba(61, 139, 110, 0.15); color: #2a6b52; }
    .alert-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .alert-item p { flex: 1; font-size: 0.9rem; }
    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .tabs button {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .tabs button.active {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }
    .back {
      color: var(--muted);
      background: none;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      padding: 0;
    }
    .quick-links { list-style: none; }
    .quick-links li { margin-bottom: 8px; }
    .quick-links a {
      display: block;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
    }
    .quick-links a:hover { border-color: var(--navy); }
    .quick-links a small { display: block; color: var(--muted); font-weight: 400; margin-top: 2px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
      transform: translateX(-50%);
      background: var(--navy);
      border: 1px solid var(--navy);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      max-width: 90vw;
    }
    .toast.show { opacity: 1; }
    .loading { text-align: center; color: var(--muted); padding: 20px; }

  </style>
</head>
<body>
  <div id="gate">
    <div class="gate-card">
      <h1>WS Baseball <span style="color:var(--accent)">HQ</span></h1>
      <p>Staff unlock required</p>
      <input id="gate-code" type="password" inputmode="numeric" placeholder="Staff code" autocomplete="off" />
      <button class="btn" id="gate-btn">Unlock</button>
      <div class="err" id="gate-err"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">WS <span>HQ</span></div>
      <button class="btn ghost" id="lock-btn" type="button">Lock again</button>
    </header>
    <main class="content" id="main"></main>
    <nav class="nav" id="nav">
      <a href="#home" data-route="home"><span class="ico">⌂</span>Home</a>
      <a href="#recruits" data-route="recruits"><span class="ico">◎</span>Recruits</a>
      <a href="#roster" data-route="roster"><span class="ico">◈</span>Roster</a>
      <a href="#practice" data-route="practice"><span class="ico">▣</span>Practice</a>
      <a href="#knowledge" data-route="knowledge"><span class="ico">☰</span>Knowledge</a>
    </nav>
  </div>
  <div class="toast" id="toast"></div>

  <script>
(function () {
  const SUPA_URL = 'https://mghrapwhvihpwgqryail.supabase.co';
  const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1naHJhcHdodmlocHdncXJ5YWlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MjQ0NzUsImV4cCI6MjA5MTAwMDQ3NX0.ilNGmGOOc-TIpwQx0e1cTK1YjYF9TvdL7nEGUEXiWFc';
  const UNLOCK_KEY = 'ws_hq_unlock';
  const sb = window.supabase.createClient(SUPA_URL, SUPA_ANON);

  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const todayISO = () => new Date().toISOString().slice(0, 10);

  let state = {
    route: 'home',
    recruitId: null,
    playerId: null,
    playerTab: 'hitting',
    recruitFilter: { grad_year: '2027', commit: '', q: '' },
    rosterFilter: { q: '' },
  };

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._tm);
    toast._tm = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function isUnlocked() {
    try {
      const raw = localStorage.getItem(UNLOCK_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (data.expires && Date.now() > Date.parse(data.expires)) {
        localStorage.removeItem(UNLOCK_KEY);
        return false;
      }
      return true;
    } catch {
      return false;
    }
  }

  function showApp() {
    $('#gate').classList.add('hidden');
    $('#app').classList.remove('hidden');
    routeFromHash();
  }

  function showGate() {
    $('#app').classList.add('hidden');
    $('#gate').classList.remove('hidden');
  }

  async function unlock() {
    const code = $('#gate-code').value.trim();
    const err = $('#gate-err');
    err.textContent = '';
    if (!code) {
      err.textContent = 'Enter staff code';
      return;
    }
    $('#gate-btn').disabled = true;
    try {
      const res = await fetch(`${SUPA_URL}/functions/v1/hq-unlock`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPA_ANON,
          Authorization: `Bearer ${SUPA_ANON}`,
        },
        body: JSON.stringify({ code }),
      });
      if (res.status === 404) {
        err.textContent = 'Unlock function not found (404). Deploy hq-unlock edge function, then try again.';
        return;
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = data.error || data.message || `Unlock failed (${res.status})`;
        return;
      }
      const expires = data.expires || new Date(Date.now() + 12 * 60 * 60 * 1000).toISOString();
      localStorage.setItem(UNLOCK_KEY, JSON.stringify({ expires }));
      showApp();
    } catch (e) {
      err.textContent = 'Network error — check connection and try again.';
    } finally {
      $('#gate-btn').disabled = false;
    }
  }

  function lockAgain() {
    localStorage.removeItem(UNLOCK_KEY);
    showGate();
    $('#gate-code').value = '';
    $('#gate-err').textContent = '';
  }

  function setNavActive(route) {
    $$('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.route === route));
  }

  function routeFromHash() {
    const hash = (location.hash || '#home').slice(1);
    const [base, id] = hash.split('/');
    if (base === 'recruit' && id) {
      state.route = 'recruit-detail';
      state.recruitId = id;
    } else if (base === 'player' && id) {
      state.route = 'player-detail';
      state.playerId = id;
      const tab = (location.hash.split('/')[2]) || 'hitting';
      state.playerTab = ['hitting','pitching','throwing','sc','notes'].includes(tab) ? tab : 'hitting';
    } else if (['home','recruits','roster','practice','knowledge'].includes(base)) {
      state.route = base;
      state.recruitId = null;
      state.playerId = null;
    } else {
      state.route = 'home';
    }
    setNavActive(['recruit-detail'].includes(state.route) ? 'recruits' : ['player-detail'].includes(state.route) ? 'roster' : state.route);
    render();
  }

  async function render() {
    const main = $('#main');
    main.innerHTML = '<div class="loading">Loading…</div>';
    try {
      if (state.route === 'home') await renderHome(main);
      else if (state.route === 'recruits') await renderRecruits(main);
      else if (state.route === 'recruit-detail') await renderRecruitDetail(main);
      else if (state.route === 'roster') await renderRoster(main);
      else if (state.route === 'player-detail') await renderPlayerDetail(main);
      else if (state.route === 'practice') await renderPractice(main);
      else if (state.route === 'knowledge') await renderKnowledge(main);
      else main.innerHTML = '<div class="empty">Unknown screen</div>';
    } catch (e) {
      console.error(e);
      main.innerHTML = `<div class="empty"><strong>Something went wrong</strong>${esc(e.message || e)}</div>`;
    }
  }

  /* ——— Home ——— */
  async function renderHome(main) {
    const day = todayISO();
    const [recruits27, players, alerts, practiceRes, knowledge] = await Promise.all([
      sb.from('hq_recruits').select('id', { count: 'exact', head: true }).eq('grad_year', 2027),
      sb.from('hq_players').select('id', { count: 'exact', head: true }).eq('active', true),
      sb.from('hq_alerts').select('*').is('resolved_at', null).order('created_at', { ascending: false }).limit(20),
      sb.from('hq_practice_days').select('*').eq('practice_date', day).maybeSingle(),
      sb.from('hq_knowledge_items').select('id', { count: 'exact', head: true }),
    ]);
    if (recruits27.error) throw recruits27.error;
    if (players.error) throw players.error;
    if (alerts.error) throw alerts.error;
    if (knowledge.error) throw knowledge.error;

    let practice = practiceRes.data;
    if (practiceRes.error && !practice) {
      const alt = await sb.from('hq_practice_days').select('*').eq('day', day).maybeSingle();
      practice = alt.data;
    }

    const openAlerts = alerts.data || [];
    const blocks = Array.isArray(practice?.blocks_json) ? practice.blocks_json : [];
    const practiceSummary = practice
      ? `<div class="card dash-practice">
          <h3>${esc(practice.theme || 'Practice')} <span class="chip">today</span></h3>
          <div class="meta">${esc(day)}</div>
          ${blocks.length ? `<ul>${blocks.map((b) => {
            const title = typeof b === 'string' ? b : (b.title || '');
            const detail = typeof b === 'object' && b.detail ? ' — ' + b.detail : '';
            return `<li>${esc(title)}${esc(detail)}</li>`;
          }).join('')}</ul>` : `<p class="meta" style="margin-top:6px">No blocks listed</p>`}
          <div class="row-btns"><a class="btn sm secondary" href="#practice">Edit practice</a></div>
        </div>`
      : `<div class="empty"><strong>No practice day for today</strong>Create one under Practice.</div>`;

    main.innerHTML = `
      <div class="section-title"><h2>Home</h2></div>
      <div class="counts rich">
        <div class="count"><div class="n">${openAlerts.length}</div><div class="l">Open alerts</div></div>
        <div class="count"><div class="n">${recruits27.count ?? 0}</div><div class="l">Recruits ’27</div></div>
        <div class="count"><div class="n">${players.count ?? 0}</div><div class="l">Active players</div></div>
        <div class="count"><div class="n">${practice ? blocks.length : 0}</div><div class="l">Practice blocks</div></div>
        <div class="count"><div class="n">${knowledge.count ?? 0}</div><div class="l">Knowledge</div></div>
      </div>
      <div class="section-title"><h2>Today’s practice</h2></div>
      ${practiceSummary}
      <div class="section-title"><h2>Alerts</h2></div>
      <div id="alert-strip">
        ${openAlerts.length ? openAlerts.map((a) => `
          <div class="card alert-item" data-alert="${esc(a.id)}">
            <div>
              <span class="chip">${esc(a.kind || 'alert')}</span>
              <p>${esc(a.message || '—')}</p>
              <div class="meta">${a.created_at ? new Date(a.created_at).toLocaleString() : ''}</div>
            </div>
            <button class="btn sm secondary resolve-alert" data-id="${esc(a.id)}">Resolve</button>
          </div>
        `).join('') : `<div class="empty"><strong>No open alerts</strong>Throw logs and assignments will surface here.</div>`}
      </div>
      <div class="section-title"><h2>Quick links</h2></div>
      <ul class="quick-links">
        <li><a href="../">TrackMan hub <small>Program home</small></a></li>
        <li><a href="../scout/">Press Box <small>Scouting packets</small></a></li>
        <li><a href="../tools/scouting-ingest.html">Scouting builder <small>Upload &amp; build</small></a></li>
        <li><a href="./player.html">Player view <small>Read-only stub</small></a></li>
      </ul>
    `;
    $$('.resolve-alert', main).forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const { error } = await sb.from('hq_alerts').update({ resolved_at: new Date().toISOString() }).eq('id', id);
        if (error) { toast(error.message); return; }
        toast('Alert resolved');
        render();
      });
    });
  }

  /* ——— Recruits ——— */
  async function renderRecruits(main) {
    const gy = state.recruitFilter.grad_year;
    const commit = state.recruitFilter.commit;
    const q = (state.recruitFilter.q || '').trim().toLowerCase();
    const yearRes = await sb.from('hq_recruits').select('grad_year');
    if (yearRes.error) throw yearRes.error;
    const years = [...new Set((yearRes.data || []).map((r) => r.grad_year).filter(Boolean))].sort();
    let query = sb.from('hq_recruits').select('*').order('last_name', { ascending: true });
    if (gy) query = query.eq('grad_year', Number(gy));
    const { data, error } = await query;
    if (error) throw error;
    let list = data || [];
    if (commit === 'blank') list = list.filter((r) => !r.commit_school);
    if (commit === 'has') list = list.filter((r) => !!r.commit_school);
    if (q) {
      list = list.filter((r) => {
        const name = `${r.first_name || ''} ${r.last_name || ''}`.toLowerCase();
        const hs = (r.high_school || r.hs || '').toLowerCase();
        return name.includes(q) || hs.includes(q);
      });
    }
    const titleYear = gy || 'All';
    const hsOf = (r) => r.high_school || r.hs || '';

    main.innerHTML = `
      <div class="section-title">
        <h2>Recruits · ${esc(titleYear)} · ${list.length}</h2>
      </div>
      <div class="filters">
        <select id="f-gy">
          <option value="">All years</option>
          ${years.map((y) => `<option value="${y}" ${String(gy)===String(y)?'selected':''}>${y}${String(y)==='2027'?' (current)':''}</option>`).join('')}
        </select>
        <select id="f-commit">
          <option value="">All commits</option>
          <option value="blank" ${commit==='blank'?'selected':''}>No commit</option>

  async function renderPlayerDetail(main) {
    const id = state.playerId;

    if (error) throw error;

    const areaMap = { hitting: 'hitting', pitching: 'pitching', throwing: 'throwing', sc: 'strength', notes: 'notes' };
    const area = areaMap[tab] || 'hitting';

    const [plansRes, assignsRes, logsRes] = await Promise.all([
      sb.from('hq_dev_plans').select('*').eq('player_id', id).eq('area', area).limit(1),
      sb.from('hq_program_assignments').select('*').eq('player_id', id).order('created_at', { ascending: false }),
      sb.from('hq_plan_logs').select('*').eq('player_id', id).order('created_at', { ascending: false }).limit(15),
    ]);
    if (plansRes.error) throw plansRes.error;
    if (assignsRes.error) throw assignsRes.error;
    if (logsRes.error) throw logsRes.error;
    const planRow = (plansRes.data && plansRes.data[0]) || null;
    const assignList = assignsRes.data || [];
    const logList = logsRes.data || [];

    const throwAssigns = assignList.filter((a) => (a.kind || a.area || '').toLowerCase().includes('throw') || a.kind === 'throwing');

    const tabs = [

  /* ——— Practice ——— */
  async function renderPractice(main) {
    const day = todayISO();
    let { data, error } = await sb.from('hq_practice_days').select('*').eq('practice_date', day).maybeSingle();
    if (error && error.code !== 'PGRST116') {
      // try date column name variants
      const alt = await sb.from('hq_practice_days').select('*').eq('day', day).maybeSingle();
      if (!alt.error) { data = alt.data; error = null; }
      else if (error) throw error;
    }
    const blocks = Array.isArray(data?.blocks_json)
      ? data.blocks_json
      : (typeof data?.blocks_json === 'string' ? JSON.parse(data.blocks_json || '[]') : []);
    const lines = (blocks || []).map((b) => {
      if (typeof b === 'string') return b;
      return [b.title, b.detail].filter(Boolean).join(' — ');
    }).join('\n');

    main.innerHTML = `
      <div class="section-title"><h2>Practice</h2><span class="meta">${day}</span></div>
      <div class="card">
        <h3>${data ? 'Edit today' : 'Create today’s plan'}</h3>
        <form class="form-grid" id="practice-form">
          <label>Theme <input name="theme" value="${esc(data?.theme || '')}" placeholder="e.g. Defense focus" /></label>
          <label>Blocks (one per line: Title — detail)
            <textarea name="blocks" placeholder="Warmup — band + plyo&#10;BP — situational">${esc(lines)}</textarea>
          </label>
          <button class="btn" type="submit">Save practice day</button>
        </form>
      </div>
      ${!data ? `<div class="empty"><strong>No practice day yet for ${day}</strong>Set a theme and blocks above.</div>` : ''}
    `;
    $('#practice-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const blocks_json = String(fd.get('blocks') || '').split('\n').map((line) => line.trim()).filter(Boolean).map((line) => {
        const parts = line.split(/\s+[—\-]\s+/);
        return { title: parts[0], detail: parts.slice(1).join(' — ') || null };
      });
      const row = {
        practice_date: day,
        theme: fd.get('theme') || null,
        blocks_json,
      };
      let err;
      if (data?.id) {
        ({ error: err } = await sb.from('hq_practice_days').update(row).eq('id', data.id));
      } else {
        ({ error: err } = await sb.from('hq_practice_days').upsert(row, { onConflict: 'practice_date' }));
        if (err) ({ error: err } = await sb.from('hq_practice_days').insert(row));
      }
      if (err) { toast(err.message); return; }
      toast('Practice saved');
      render();
    });
  }

          ${k.source_text ? `<p class="meta" style="margin-top:6px;white-space:pre-wrap">${esc(k.source_text).slice(0, 280)}${String(k.source_text).length > 280 ? '…' : ''}</p>` : ''}
        </div>
      `).join('') : `<div class="empty"><strong>No knowledge items yet — add one</strong>Clip articles, drills, and cues.</div>`}
      <div class="card">
        <h3>Add item</h3>
        <form class="form-grid" id="add-knowledge">
          <label>Source URL <input name="source_url" type="url" placeholder="https://" /></label>
          <label>Source text <textarea name="source_text"></textarea></label>
          <label>Summary <textarea name="summary" required></textarea></label>
          <label>Tags (comma) <input name="tags" placeholder="hitting, velo" /></label>
          <button class="btn" type="submit">Save</button>
        </form>
      </div>
    `;
    $('#add-knowledge').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const tagsRaw = String(fd.get('tags') || '');
      const tags = tagsRaw.split(',').map((t) => t.trim()).filter(Boolean);
      const row = {
        source_url: fd.get('source_url') || null,
        source_text: fd.get('source_text') || null,
        summary: fd.get('summary'),
        tags,
      };
      const { error: err } = await sb.from('hq_knowledge_items').insert(row);
      if (err) { toast(err.message); return; }
      toast('Saved');
      e.target.reset();
      render();
    });
  }

  /* boot */
  $('#gate-btn').addEventListener('click', unlock);
  $('#gate-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
  $('#lock-btn').addEventListener('click', lockAgain);
  window.addEventListener('hashchange', routeFromHash);

  if (isUnlocked()) showApp();
  else showGate();
})();
  </script>
</body>
</html>
