<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1c2c" />
  <title>WS HQ — Player (stub)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy: #0b1c2c;
      --cream: #f2ead8;
      --accent: #c45c26;
      --card: #132a3f;
      --muted: #8fa3b5;
      --border: rgba(242, 234, 216, 0.12);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: var(--navy);
      color: var(--cream);
      font-family: Barlow, system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      padding: 14px;
      padding-bottom: 32px;
      max-width: 560px;
      margin: 0 auto;
    }
    h1, h2, h3 { font-family: Oswald, Barlow, sans-serif; font-weight: 600; }
    a { color: var(--accent); }
    .banner {
      background: rgba(196, 92, 38, 0.18);
      border: 1px solid rgba(196, 92, 38, 0.45);
      color: #e8a882;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
    }
    .meta { color: var(--muted); font-size: 0.82rem; }
    .chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(196, 92, 38, 0.2);
      color: #e8a882;
      font-size: 0.72rem;
      font-weight: 600;
      margin-right: 4px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }
    select, button {
      font: inherit;
      color: inherit;
    }
    select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--navy);
      width: 100%;
    }
    .empty {
      text-align: center;
      padding: 24px 12px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
    }
    .empty strong { display: block; color: var(--cream); margin-bottom: 4px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .top h1 { font-size: 1.35rem; }
    .top h1 span { color: var(--accent); }
    .section-title { margin: 16px 0 8px; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="banner">
    <strong>Player view stub</strong> — not real player auth yet. Pick yourself from the roster dropdown for a read-only MVP preview.
  </div>
  <div class="top">
    <h1>WS <span>Player</span></h1>
    <a href="index.html">Staff HQ</a>
  </div>

  <div class="card">
    <label>
      Active player
      <select id="player-pick">
        <option value="">Loading…</option>
      </select>
    </label>
  </div>

  <div id="view">
    <div class="empty"><strong>Select a player</strong>Dev plans, assignments, today’s practice, and recent logs will show here.</div>
  </div>

  <script>
(function () {
  const SUPA_URL = 'https://mghrapwhvihpwgqryail.supabase.co';
  const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1naHJhcHdodmlocHdncXJ5YWlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MjQ0NzUsImV4cCI6MjA5MTAwMDQ3NX0.ilNGmGOOc-TIpwQx0e1cTK1YjYF9TvdL7nEGUEXiWFc';
  const sb = window.supabase.createClient(SUPA_URL, SUPA_ANON);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const todayISO = () => new Date().toISOString().slice(0, 10);
  const pick = document.getElementById('player-pick');
  const view = document.getElementById('view');

  async function loadPlayers() {
    const { data, error } = await sb.from('hq_players').select('id, first_name, last_name, pos, number').eq('active', true).order('last_name');
    if (error) {
      pick.innerHTML = '<option value="">Error loading players</option>';
      view.innerHTML = `<div class="empty"><strong>Could not load roster</strong>${esc(error.message)}</div>`;
      return;
    }
    const list = data || [];
    if (!list.length) {
      pick.innerHTML = '<option value="">No active players</option>';
      view.innerHTML = `<div class="empty"><strong>No active players yet</strong>Staff can add players in HQ Roster.</div>`;
      return;
    }
    pick.innerHTML = '<option value="">Choose player…</option>' + list.map((p) =>
      `<option value="${esc(p.id)}">${esc(p.last_name)}, ${esc(p.first_name)}${p.pos ? ' · ' + esc(p.pos) : ''}</option>`
    ).join('');
  }

  async function showPlayer(id) {
    if (!id) {
      view.innerHTML = `<div class="empty"><strong>Select a player</strong>Dev plans, assignments, today’s practice, and recent logs will show here.</div>`;
      return;
    }
    view.innerHTML = `<div class="empty">Loading…</div>`;
    const day = todayISO();
    const [playerRes, plansRes, assignRes, practiceRes, logsRes] = await Promise.all([
      sb.from('hq_players').select('*').eq('id', id).single(),
      sb.from('hq_dev_plans').select('*').eq('player_id', id),
      sb.from('hq_program_assignments').select('*').eq('player_id', id).order('created_at', { ascending: false }),
      sb.from('hq_practice_days').select('*').eq('practice_date', day).maybeSingle(),
      sb.from('hq_plan_logs').select('*').eq('player_id', id).order('created_at', { ascending: false }).limit(20),
    ]);

    if (playerRes.error) {
      view.innerHTML = `<div class="empty"><strong>Error</strong>${esc(playerRes.error.message)}</div>`;
      return;
    }
    const p = playerRes.data;
    const plans = plansRes.data || [];
    const assigns = assignRes.data || [];
    let practice = practiceRes.data;
    if (practiceRes.error && !practice) {
      const alt = await sb.from('hq_practice_days').select('*').eq('day', day).maybeSingle();
      practice = alt.data;
    }
    const logs = logsRes.data || [];
    const blocks = Array.isArray(practice?.blocks_json) ? practice.blocks_json : [];

    view.innerHTML = `
      <div class="card">
        <h2>${esc(p.first_name)} ${esc(p.last_name)}</h2>
        <div class="meta">
          ${p.pos ? `<span class="chip">${esc(p.pos)}</span>` : ''}
          ${p.class_year || ''} ${p.number != null ? '#' + esc(p.number) : ''}
        </div>
      </div>

      <h2 class="section-title">Dev plans</h2>
      ${plans.length ? plans.map((pl) => `
        <div class="card">
          <h3><span class="chip">${esc(pl.area)}</span></h3>
          ${pl.goals ? `<p><strong>Goals</strong><br>${esc(pl.goals)}</p>` : ''}
          ${pl.cues ? `<p style="margin-top:8px"><strong>Cues</strong><br>${esc(pl.cues)}</p>` : ''}
          ${!pl.goals && !pl.cues ? `<p class="meta">Empty plan</p>` : ''}
        </div>
      `).join('') : `<div class="empty"><strong>No dev plans yet</strong>Staff can add goals/cues in Roster.</div>`}

      <h2 class="section-title">Active assignments</h2>
      ${assigns.length ? assigns.map((a) => `
        <div class="card">
          <h3>${esc(a.title || 'Assignment')}</h3>
          <div class="meta">${esc(a.kind || '')}</div>
          <p style="white-space:pre-wrap;margin-top:6px">${esc(a.body_md || a.body || '')}</p>
        </div>
      `).join('') : `<div class="empty"><strong>No assignments</strong></div>`}

      <h2 class="section-title">Today’s practice (${esc(day)})</h2>
      ${practice ? `
        <div class="card">
          <h3>${esc(practice.theme || 'Practice')}</h3>
          ${blocks.length ? `<ul style="margin-top:8px;padding-left:18px">${blocks.map((b) => {
            const title = typeof b === 'string' ? b : (b.title || '');
            const detail = typeof b === 'object' && b.detail ? ' — ' + b.detail : '';
            return `<li>${esc(title)}${esc(detail)}</li>`;
          }).join('')}</ul>` : `<p class="meta">No blocks listed</p>`}
        </div>
      ` : `<div class="empty"><strong>No practice day posted for today</strong></div>`}

      <h2 class="section-title">Recent logs</h2>
      ${logs.length ? logs.map((l) => `
        <div class="card">
          <div class="meta">${esc(l.kind)} · ${l.created_at ? new Date(l.created_at).toLocaleString() : ''}</div>
          <p>
            ${l.planned_throws != null ? `Planned ${esc(l.planned_throws)}` : ''}
            ${l.actual_throws != null ? ` · Actual ${esc(l.actual_throws)}` : ''}
          </p>
          ${l.notes ? `<p class="meta">${esc(l.notes)}</p>` : ''}
        </div>
      `).join('') : `<div class="empty"><strong>No recent logs</strong></div>`}
    `;
  }

  pick.addEventListener('change', () => showPlayer(pick.value));
  loadPlayers();
})();
  </script>
</body>
</html>
