<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Opposing Pitcher Scout — WSCC Baseball</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #f2ead8;
  color: #1a1a1a;
  font-family: 'Source Serif 4', Georgia, serif;
  min-height: 100vh;
}

.container { max-width: 900px; margin: 0 auto; padding-bottom: 60px; }

.header {
  background: #1a1a1a;
  color: #f2ead8;
  padding: 14px 18px 12px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
}
.header-title {
  font-family: 'Abril Fatface', serif;
  font-size: 22px;
  letter-spacing: 0.3px;
  line-height: 1;
}
.header-sub {
  font-family: 'Anton', sans-serif;
  font-size: 10px;
  letter-spacing: 2.5px;
  color: #a89070;
  margin-top: 3px;
  text-transform: uppercase;
}
.header-badge {
  font-family: 'Anton', sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  color: #a89070;
  border: 1px solid #3a3a3a;
  padding: 3px 8px;
  text-transform: uppercase;
}

.banner {
  background: #1a1a1a;
  color: #f2ead8;
  font-family: 'Anton', sans-serif;
  font-size: 10px;
  letter-spacing: 2.5px;
  padding: 5px 16px;
  text-transform: uppercase;
}

.controls {
  background: #e8e0c8;
  border-bottom: 1.5px solid #1a1a1a;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.select-wrap { position: relative; }
.select-wrap::after {
  content: '▾';
  position: absolute;
  right: 12px;
  top: 50%;
  -webkit-transform: translateY(-50%);
  transform: translateY(-50%);
  pointer-events: none;
  font-size: 14px;
  color: #5a4a38;
}
select {
  width: 100%;
  padding: 9px 32px 9px 12px;
  font-size: 14px;
  font-family: 'Source Serif 4', Georgia, serif;
  background: #f2ead8;
  border: 1.5px solid #1a1a1a;
  border-radius: 0;
  color: #1a1a1a;
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
}
select:disabled { opacity: 0.5; cursor: not-allowed; }

.pitcher-header {
  padding: 12px 16px 10px;
  border-bottom: 1px solid #c8b89a;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.pitcher-name {
  font-family: 'Abril Fatface', serif;
  font-size: 20px;
  line-height: 1.1;
}
.pitcher-team {
  font-family: 'Anton', sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  color: #7a6a58;
  margin-top: 2px;
  text-transform: uppercase;
}
.pitcher-meta {
  font-family: 'Anton', sans-serif;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: #7a6a58;
  text-align: right;
  text-transform: uppercase;
}

.stat-row {
  display: flex;
  flex-wrap: wrap;
  border-top: 1px solid #c8b89a;
  border-bottom: 1px solid #c8b89a;
}
.stat-cell {
  flex: 1;
  min-width: 52px;
  text-align: center;
  padding: 10px 4px 8px;
  border-right: 1px solid #c8b89a;
  background: #f2ead8;
}
.stat-cell:last-child { border-right: none; }
.stat-val {
  font-family: 'Anton', sans-serif;
  font-size: 19px;
  line-height: 1;
  color: #1a1a1a;
}
.stat-lbl {
  font-family: 'Anton', sans-serif;
  font-size: 9px;
  letter-spacing: 1px;
  color: #7a6a58;
  margin-top: 3px;
  text-transform: uppercase;
}
.stat-footnote {
  font-family: 'Anton', sans-serif;
  font-size: 9px;
  letter-spacing: 1.5px;
  color: #9a8a78;
  padding: 4px 16px;
  text-transform: uppercase;
  background: #ede5d0;
  border-bottom: 1px solid #c8b89a;
}

.tab-bar {
  display: flex;
  border-bottom: 2px solid #1a1a1a;
  background: #ede5d0;
  margin: 0;
}
.tab {
  padding: 9px 18px;
  font-family: 'Anton', sans-serif;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  color: #9a8a78;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
.tab.active {
  color: #1a1a1a;
  border-bottom-color: #1a1a1a;
}

.section { display: none; }
.section.active { display: block; }

.arsenal-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  font-family: 'Anton', sans-serif;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 8px;
  text-align: center;
  background: #e0d8c4;
  border-bottom: 2px solid #1a1a1a;
  color: #1a1a1a;
  white-space: nowrap;
}
thead th:first-child { text-align: left; padding-left: 14px; }
tbody td {
  padding: 8px;
  text-align: center;
  border-bottom: 1px solid #d8cdb8;
  vertical-align: middle;
}
tbody td:first-child { text-align: left; padding-left: 14px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #ede5d0; }

.pt-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
.pt-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.pt-abbr { font-family: 'Anton', sans-serif; font-size: 10px; }
.pt-name { font-size: 11px; color: #5a4a38; }

.usage-bar { height: 4px; background: #d8cdb8; border-radius: 2px; margin-top: 3px; overflow: hidden; }
.usage-fill { height: 100%; border-radius: 2px; }

.count-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: #c8b89a;
}
.count-cell { background: #f2ead8; padding: 10px 12px; }
.count-label {
  font-family: 'Anton', sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #7a6a58;
  margin-bottom: 5px;
}
.count-n { color: #1a1a1a; font-size: 9px; }
.count-bar-wrap {
  display: flex;
  height: 16px;
  border-radius: 1px;
  overflow: hidden;
  margin-bottom: 5px;
  background: #d8cdb8;
}
.count-bar-seg { height: 100%; }
.count-legend { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
.leg-item { display: flex; align-items: center; gap: 3px; font-size: 10px; color: #3a3a3a; }
.leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.count-no-data { font-style: italic; font-size: 11px; color: #a09080; }

.loc-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 14px 12px;
  justify-content: center;
  background: #f2ead8;
}
.loc-item { text-align: center; }
.loc-label {
  font-family: 'Anton', sans-serif;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #7a6a58;
  margin-top: 5px;
}

.msg {
  padding: 28px 20px;
  text-align: center;
  color: #9a8a78;
  font-style: italic;
  font-size: 13px;
}

.divider { height: 1px; background: #c8b89a; }

.empty-state { padding: 50px 20px; text-align: center; }
.empty-state-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.4; }
.empty-state-text {
  font-family: 'Anton', sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #9a8a78;
}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="header-title">Opposing Pitcher Scout</div>
      <div class="header-sub">WSCC Baseball · TrackMan Analytics</div>
    </div>
    <div class="header-badge">Pre-Game Prep</div>
  </div>

  <div class="controls">
    <div class="select-wrap">
      <select id="teamSelect" onchange="onTeamChange()">
        <option value="">— Select Opponent —</option>
      </select>
    </div>
    <div class="select-wrap">
      <select id="pitcherSelect" onchange="onPitcherChange()" disabled>
        <option value="">— Select Pitcher —</option>
      </select>
    </div>
  </div>

  <div id="emptyState" class="empty-state">
    <div class="empty-state-icon">⚾</div>
    <div class="empty-state-text">Select an opponent and pitcher<br>to load scout report</div>
  </div>

  <div id="reportArea" style="display:none;">

    <div class="pitcher-header">
      <div>
        <div class="pitcher-name" id="pitcherNameDisplay"></div>
        <div class="pitcher-team" id="pitcherTeamDisplay"></div>
      </div>
      <div class="pitcher-meta" id="pitcherMeta"></div>
    </div>

    <div class="banner">Season Line vs Walters State</div>
    <div id="boxScoreArea"><div class="msg">Loading box scores…</div></div>

    <div class="divider"></div>

    <div class="tab-bar">
      <div class="tab active" onclick="switchTab('arsenal')">Arsenal</div>
      <div class="tab" onclick="switchTab('counts')">By Count</div>
      <div class="tab" onclick="switchTab('locations')">Locations</div>
    </div>

    <div id="tab-arsenal" class="section active">
      <div class="arsenal-wrap">
        <div id="arsenalArea"><div class="msg">Loading…</div></div>
      </div>
    </div>

    <div id="tab-counts" class="section">
      <div id="countArea"><div class="msg">Loading…</div></div>
    </div>

    <div id="tab-locations" class="section">
      <div id="locationArea"><div class="msg">Loading…</div></div>
    </div>

  </div>

</div>

<script>
const SUPABASE_URL = 'https://mghrapwhvihpwgqryail.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1naHJhcHdodmlocHdncXJ5YWlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MjQ0NzUsImV4cCI6MjA5MTAwMDQ3NX0.ilNGmGOOc-TIpwQx0e1cTK1YjYF9TvdL7nEGUEXiWFc';

const PITCH_META = {
  'FourSeamFastBall': { abbr: 'FF', label: 'Four-Seam',   color: '#e03030' },
  'Four-Seam':        { abbr: 'FF', label: 'Four-Seam',   color: '#e03030' },
  'Fastball':         { abbr: 'FF', label: 'Fastball',    color: '#e03030' },
  'TwoSeamFastBall':  { abbr: 'SI', label: 'Sinker',      color: '#ff7f0e' },
  'Sinker':           { abbr: 'SI', label: 'Sinker',      color: '#ff7f0e' },
  'Cutter':           { abbr: 'CT', label: 'Cutter',      color: '#e377c2' },
  'Slider':           { abbr: 'SL', label: 'Slider',      color: '#2ca02c' },
  'Curveball':        { abbr: 'CB', label: 'Curveball',   color: '#1f77b4' },
  'ChangeUp':         { abbr: 'CH', label: 'Changeup',    color: '#9467bd' },
  'Changeup':         { abbr: 'CH', label: 'Changeup',    color: '#9467bd' },
  'Splitter':         { abbr: 'SP', label: 'Splitter',    color: '#8c564b' },
  'Knuckleball':      { abbr: 'KN', label: 'Knuckleball', color: '#7f7f7f' },
  'Other':            { abbr: 'OT', label: 'Other',       color: '#bcbd22' },
  'Undefined':        { abbr: '??', label: 'Unknown',     color: '#bbbbbb' },
};

function getMeta(type) {
  return PITCH_META[type] || { abbr: (type||'??').substring(0,2).toUpperCase(), label: type||'Unknown', color: '#aaaaaa' };
}

function resolvedType(p) {
  if (p.TaggedPitchType && p.TaggedPitchType !== 'Undefined' && p.TaggedPitchType.trim() !== '') {
    return p.TaggedPitchType;
  }
  return p.AutoPitchType || 'Undefined';
}

function avg(arr) {
  const v = arr.filter(x => x != null && !isNaN(x));
  if (!v.length) return null;
  return v.reduce((a,b) => a+b, 0) / v.length;
}
function fmt(val, dec) {
  if (val == null || isNaN(val)) return '—';
  return val.toFixed(dec != null ? dec : 1);
}
function parseIP(s) {
  if (!s) return 0;
  const parts = String(s).trim().split('.');
  return (parseInt(parts[0])||0) + (parseInt(parts[1])||0) / 3;
}
function formatIP(d) {
  const f = Math.floor(d);
  return f + '.' + Math.round((d-f)*3);
}

async function sbFetch(table, params) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?' + params, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Accept': 'application/json',
    }
  });
  if (!res.ok) throw new Error('Supabase ' + res.status);
  return res.json();
}

async function loadTeams() {
  try {
    const data = await sbFetch('pitches',
      'select=PitcherTeam&PitcherTeam=not.eq.Wal_Sen&PitcherTeam=not.is.null&limit=5000'
    );
    const teams = [...new Set(data.map(r => r.PitcherTeam).filter(Boolean))]
      .filter(t => t.trim() !== '')
      .sort();
    const sel = document.getElementById('teamSelect');
    teams.forEach(t => {
      const o = document.createElement('option');
      o.value = t; o.textContent = t;
      sel.appendChild(o);
    });
  } catch(e) { console.error('loadTeams:', e); }
}

async function onTeamChange() {
  const team = document.getElementById('teamSelect').value;
  const ps = document.getElementById('pitcherSelect');
  ps.innerHTML = '<option value="">— Select Pitcher —</option>';
  ps.disabled = true;
  document.getElementById('reportArea').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
  if (!team) return;
  try {
    const data = await sbFetch('pitches',
      'select=Pitcher&PitcherTeam=eq.' + encodeURIComponent(team) +
      '&Pitcher=not.is.null&limit=5000'
    );
    const pitchers = [...new Set(data.map(r => r.Pitcher).filter(Boolean))].sort();
    pitchers.forEach(p => {
      const o = document.createElement('option');
      o.value = p; o.textContent = p;
      ps.appendChild(o);
    });
    ps.disabled = false;
  } catch(e) { console.error('onTeamChange:', e); }
}

let currentPitches = [];

async function onPitcherChange() {
  const pitcher = document.getElementById('pitcherSelect').value;
  const team    = document.getElementById('teamSelect').value;
  if (!pitcher) return;

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('reportArea').style.display = 'block';
  document.getElementById('pitcherNameDisplay').textContent = pitcher;
  document.getElementById('pitcherTeamDisplay').textContent = team;
  document.getElementById('pitcherMeta').textContent = '';

  ['boxScoreArea','arsenalArea','countArea','locationArea'].forEach(id => {
    document.getElementById(id).innerHTML = '<div class="msg">Loading…</div>';
  });
  switchTab('arsenal');

  try {
    const pitches = await sbFetch('pitches',
      'select=*&Pitcher=eq.' + encodeURIComponent(pitcher) +
      '&PitcherTeam=eq.' + encodeURIComponent(team) +
      '&order=game_id.asc&limit=2000'
    );
    currentPitches = pitches;
    const gameIds = [...new Set(pitches.map(p => p.game_id).filter(Boolean))];
    document.getElementById('pitcherMeta').textContent =
      gameIds.length + ' Game' + (gameIds.length !== 1 ? 's' : '') + ' · ' + pitches.length + ' Pitches';

    renderArsenal(pitches);
    renderCounts(pitches);
    renderLocations(pitches);
    fetchBoxScores(pitcher, gameIds);
  } catch(e) {
    console.error('onPitcherChange:', e);
    document.getElementById('arsenalArea').innerHTML = '<div class="msg">Error loading data.</div>';
    document.getElementById('boxScoreArea').innerHTML = '<div class="msg">Error loading data.</div>';
  }
}

async function fetchBoxScores(pitcherName, gameIds) {
  if (!gameIds.length) {
    document.getElementById('boxScoreArea').innerHTML = '<div class="msg">No games found.</div>';
    return;
  }
  try {
    const inParam = gameIds.map(id => '"' + id + '"').join(',');
    const games = await sbFetch('games',
      'select=game_id,box_score_url&game_id=in.(' + inParam + ')'
    );
    const valid = games.filter(g => g.box_score_url);
    if (!valid.length) {
      document.getElementById('boxScoreArea').innerHTML = '<div class="msg">No box score URLs found for these games.</div>';
      return;
    }

    const searchName = pitcherName.includes(',')
      ? pitcherName.split(',')[0].trim().toLowerCase()
      : pitcherName.split(' ').pop().toLowerCase();

    const totals = { G:0, IP:0, H:0, R:0, ER:0, BB:0, K:0 };
    let found = 0;

    for (const game of valid) {
      try {
        const res = await fetch(SUPABASE_URL + '/functions/v1/fetch-boxscore', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY },
          body: JSON.stringify({ url: game.box_score_url })
        });
        if (!res.ok) continue;
        const bs = await res.json();
        const all = [...(bs.homePitchers||[]), ...(bs.awayPitchers||[]), ...(bs.pitchers||[])];
        const match = all.find(p => {
          const n = (p.name || p.Name || '').toLowerCase();
          const nLast = n.includes(',') ? n.split(',')[0].trim() : n.split(' ').pop();
          return nLast.includes(searchName) || searchName.includes(nLast);
        });
        if (match) {
          found++;
          totals.G++;
          totals.IP += parseIP(match.ip || match.IP || '0');
          totals.H  += parseInt(match.h  || match.H  || 0) || 0;
          totals.R  += parseInt(match.r  || match.R  || 0) || 0;
          totals.ER += parseInt(match.er || match.ER || 0) || 0;
          totals.BB += parseInt(match.bb || match.BB || 0) || 0;
          totals.K  += parseInt(match.k  || match.K  || match.so || match.SO || 0) || 0;
        }
      } catch(e) { console.warn('box score error:', e); }
    }
    renderBoxScore(totals, found, valid.length);
  } catch(e) {
    console.error('fetchBoxScores:', e);
    document.getElementById('boxScoreArea').innerHTML = '<div class="msg">Error fetching box scores.</div>';
  }
}

function renderBoxScore(t, found, total) {
  if (!found) {
    document.getElementById('boxScoreArea').innerHTML =
      '<div class="msg">Pitcher not matched in box score data.</div>';
    return;
  }
  const era  = t.IP > 0 ? (t.ER / t.IP * 9).toFixed(2) : '—';
  const whip = t.IP > 0 ? ((t.H + t.BB) / t.IP).toFixed(2) : '—';
  const cells = [
    {v:t.G,            l:'G'},
    {v:formatIP(t.IP), l:'IP'},
    {v:era,            l:'ERA'},
    {v:whip,           l:'WHIP'},
    {v:t.K,            l:'K'},
    {v:t.BB,           l:'BB'},
    {v:t.H,            l:'H'},
    {v:t.ER,           l:'ER'},
  ];
  document.getElementById('boxScoreArea').innerHTML =
    '<div class="stat-row">' +
    cells.map(c =>
      '<div class="stat-cell"><div class="stat-val">' + c.v +
      '</div><div class="stat-lbl">' + c.l + '</div></div>'
    ).join('') +
    '</div>' +
    '<div class="stat-footnote">vs Walters State · ' + found + '/' + total + ' games matched</div>';
}

function renderArsenal(pitches) {
  const byType = {};
  pitches.forEach(p => {
    const pt = resolvedType(p);
    if (!byType[pt]) byType[pt] = [];
    byType[pt].push(p);
  });
  const total = pitches.length;
  const sorted = Object.entries(byType).sort((a,b) => b[1].length - a[1].length);
  if (!sorted.length) {
    document.getElementById('arsenalArea').innerHTML = '<div class="msg">No pitch data.</div>';
    return;
  }
  const rows = sorted.map(([pt, ps]) => {
    const meta = getMeta(pt);
    const pct  = (ps.length / total * 100);
    const velos = ps.map(p => p.RelSpeed).filter(v => v > 0);
    const spins = ps.map(p => p.SpinRate).filter(v => v > 0);
    const ivbs  = ps.map(p => p.InducedVertBreak).filter(v => v != null && !isNaN(v));
    const hbs   = ps.map(p => p.HorzBreak).filter(v => v != null && !isNaN(v));
    return '<tr>' +
      '<td><div class="pt-pill">' +
        '<div class="pt-swatch" style="background:' + meta.color + '"></div>' +
        '<span class="pt-abbr">' + meta.abbr + '</span>' +
        '<span class="pt-name">' + meta.label + '</span>' +
      '</div></td>' +
      '<td>' + ps.length + '</td>' +
      '<td><div style="font-weight:600">' + pct.toFixed(1) + '%</div>' +
        '<div class="usage-bar"><div class="usage-fill" style="width:' + pct.toFixed(1) + '%;background:' + meta.color + '"></div></div></td>' +
      '<td>' + fmt(avg(velos)) + '</td>' +
      '<td>' + (velos.length ? Math.max(...velos).toFixed(1) : '—') + '</td>' +
      '<td>' + fmt(avg(spins), 0) + '</td>' +
      '<td>' + fmt(avg(ivbs)) + '</td>' +
      '<td>' + fmt(avg(hbs)) + '</td>' +
      '</tr>';
  }).join('');
  document.getElementById('arsenalArea').innerHTML =
    '<table><thead><tr>' +
    '<th style="text-align:left">Pitch</th><th>#</th><th>Usage</th>' +
    '<th>Avg V</th><th>Max V</th><th>Spin</th><th>iVB</th><th>HB</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

const COUNT_GROUPS = [
  { label: 'First Pitch',      filter: p => p.Balls===0 && p.Strikes===0 },
  { label: "Hitter's Counts",  filter: p => { const b=p.Balls,s=p.Strikes; return (b===1&&s===0)||(b===2&&s===0)||(b===3&&s===0)||(b===2&&s===1)||(b===3&&s===1); } },
  { label: 'Even Counts',      filter: p => (p.Balls===1&&p.Strikes===1)||(p.Balls===2&&p.Strikes===2) },
  { label: "Pitcher's Counts", filter: p => { const b=p.Balls,s=p.Strikes; return (b===0&&s===1)||(b===0&&s===2)||(b===1&&s===2); } },
  { label: 'Two Strikes',      filter: p => p.Strikes===2 },
  { label: 'Full Count',       filter: p => p.Balls===3 && p.Strikes===2 },
];

function renderCounts(pitches) {
  const cells = COUNT_GROUPS.map(group => {
    const sub = pitches.filter(group.filter);
    if (!sub.length) return '<div class="count-cell"><div class="count-label">' + group.label + '</div><div class="count-no-data">No data</div></div>';
    const n = sub.length;
    const byType = {};
    sub.forEach(p => { const pt = resolvedType(p); byType[pt] = (byType[pt]||0)+1; });
    const sorted = Object.entries(byType).sort((a,b) => b[1]-a[1]);
    const bars = sorted.map(([pt,cnt]) =>
      '<div class="count-bar-seg" style="width:' + (cnt/n*100).toFixed(1) + '%;background:' + getMeta(pt).color + '"></div>'
    ).join('');
    const legend = sorted.slice(0,5).map(([pt,cnt]) => {
      const meta = getMeta(pt);
      return '<div class="leg-item"><div class="leg-dot" style="background:' + meta.color + '"></div><span>' + meta.abbr + ' ' + (cnt/n*100).toFixed(0) + '%</span></div>';
    }).join('');
    return '<div class="count-cell">' +
      '<div class="count-label">' + group.label + ' <span class="count-n">n=' + n + '</span></div>' +
      '<div class="count-bar-wrap">' + bars + '</div>' +
      '<div class="count-legend">' + legend + '</div>' +
      '</div>';
  }).join('');
  document.getElementById('countArea').innerHTML = '<div class="count-grid">' + cells + '</div>';
}

function renderLocations(pitches) {
  const wrap = document.getElementById('locationArea');
  wrap.innerHTML = '';
  const byType = {};
  pitches.forEach(p => {
    const pt = resolvedType(p);
    if (!byType[pt]) byType[pt] = [];
    byType[pt].push(p);
  });
  const sortedTypes = Object.entries(byType).sort((a,b) => b[1].length - a[1].length);
  const maps = [
    { label: 'All Pitches', pitches, color: null },
    ...sortedTypes.map(([pt,ps]) => ({ label: getMeta(pt).abbr + ' — ' + getMeta(pt).label, pitches: ps, color: getMeta(pt).color }))
  ];
  const locWrap = document.createElement('div');
  locWrap.className = 'loc-wrap';
  maps.forEach(function(m) {
    const item = document.createElement('div');
    item.className = 'loc-item';
    const canvas = document.createElement('canvas');
    canvas.width = 155; canvas.height = 185;
    canvas.style.cssText = 'width:155px;height:185px;border:1px solid #c8b89a;';
    drawZoneMap(canvas, m.pitches, m.color);
    const lbl = document.createElement('div');
    lbl.className = 'loc-label';
    lbl.textContent = m.label + ' (' + m.pitches.length + ')';
    item.appendChild(canvas);
    item.appendChild(lbl);
    locWrap.appendChild(item);
  });
  wrap.appendChild(locWrap);
}

function drawZoneMap(canvas, pitches, singleColor) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const SIDE_MIN = -2.5, SIDE_MAX = 2.5, HT_MIN = 0.5, HT_MAX = 4.5;
  function toX(side)   { return (((-side) - SIDE_MIN) / (SIDE_MAX - SIDE_MIN)) * W; }
  function toY(height) { return H - ((height - HT_MIN) / (HT_MAX - HT_MIN)) * H; }

  ctx.fillStyle = '#f9f5ec';
  ctx.fillRect(0, 0, W, H);

  const SZ_L=-0.708, SZ_R=0.708, SZ_B=1.5, SZ_T=3.5;

  ctx.strokeStyle = '#c0b0a0'; ctx.lineWidth = 0.8; ctx.setLineDash([3,3]);
  ctx.strokeRect(toX(SZ_R+0.145), toY(SZ_T+0.145), toX(SZ_L-0.145)-toX(SZ_R+0.145), toY(SZ_B-0.145)-toY(SZ_T+0.145));

  ctx.setLineDash([]); ctx.strokeStyle = '#c0b0a0'; ctx.lineWidth = 0.5;
  var cW=(SZ_R-SZ_L)/3, rH=(SZ_T-SZ_B)/3;
  for (var i=1; i<3; i++) {
    ctx.beginPath(); ctx.moveTo(toX(SZ_L+cW*i), toY(SZ_T)); ctx.lineTo(toX(SZ_L+cW*i), toY(SZ_B)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(toX(SZ_L), toY(SZ_B+rH*i)); ctx.lineTo(toX(SZ_R), toY(SZ_B+rH*i)); ctx.stroke();
  }

  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1.5;
  ctx.strokeRect(toX(SZ_R), toY(SZ_T), toX(SZ_L)-toX(SZ_R), toY(SZ_B)-toY(SZ_T));

  var pW = toX(SZ_L)-toX(SZ_R), pCX = toX(0), pY = toY(0.25);
  ctx.fillStyle='#bbbbbb'; ctx.strokeStyle='#888'; ctx.lineWidth=0.8;
  ctx.beginPath();
  ctx.moveTo(pCX-pW/2, pY-4); ctx.lineTo(pCX+pW/2, pY-4);
  ctx.lineTo(pCX+pW/2, pY); ctx.lineTo(pCX, pY+5); ctx.lineTo(pCX-pW/2, pY);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  pitches.forEach(function(p) {
    var side=p.PlateLocSide, ht=p.PlateLocHeight;
    if (side==null||ht==null||isNaN(side)||isNaN(ht)||Math.abs(side)>3||ht<0||ht>6) return;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = singleColor || getMeta(resolvedType(p)).color;
    ctx.beginPath(); ctx.arc(toX(side), toY(ht), 2.8, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
  document.querySelector('.tab[onclick="switchTab(\'' + name + '\')"]').classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

loadTeams();
</script>
